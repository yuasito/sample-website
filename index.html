<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="dashboard-header">
        <div>
            <h2>👥 User Management</h2>
            <p class="subtitle">Organize and manage system accounts efficiently.</p>
        </div>
        <button type="button" id="darkModeToggle">🌙 Dark Mode</button>
    </div>

    <div class="action-bar">
        <h3>All Users</h3>
        <a href="create.html" class="btn-primary">+ Add New User</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
<script>
    const tbody = document.getElementById('userTableBody');

    function renderUsers() {
        // ORDER BY id DESC
        const users = getUsers().sort((a, b) => b.id - a.id);

        if (users.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="empty-state">
                        <strong>No users found</strong>
                        <p>Click "Add New User" to get started.</p>
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = users.map(user => `
            <tr>
                <td>${escapeHtml(user.id)}</td>
                <td>${escapeHtml(user.name)}</td>
                <td>${escapeHtml(user.email)}</td>
                <td class="actions">
                    <a href="update.html?id=${Number(user.id)}" class="btn-edit">Edit</a>
                    <a href="#" class="btn-delete" data-id="${Number(user.id)}">Delete</a>
                </td>
            </tr>
        `).join('');
    }

    tbody.addEventListener('click', function (e) {
        const btn = e.target.closest('.btn-delete');
        if (!btn) return;
        e.preventDefault();

        if (confirm('Are you sure you want to delete this user?')) {
            const id = parseInt(btn.dataset.id, 10);
            saveUsers(getUsers().filter(u => u.id !== id));
            renderUsers();
        }
    });

    renderUsers();
</script>

</body>
</html>
