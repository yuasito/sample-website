<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New User</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="dashboard-header">
        <div>
            <h2>➕ Add New User</h2>
            <p class="subtitle">Enter details to create a new user account.</p>
        </div>
        <button type="button" id="darkModeToggle">🌙 Dark Mode</button>
    </div>

    <div class="form-card">
        <form id="createForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Full Name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter Email Address" required>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Submit</button>
                <a href="index.html" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
<script>
    document.getElementById('createForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();

        if (name !== '' && email !== '') {
            const users = getUsers();
            users.push({ id: getNextId(), name: name, email: email });
            saveUsers(users);
            window.location.href = 'index.html';
        }
    });
</script>

</body>
</html>
